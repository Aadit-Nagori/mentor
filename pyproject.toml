[project]
name = "mentor"
version = "0.1.0"
description = "A code reviewer that withholds the answer - aims to supplement learning rather than replace it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.2.0",
    "typer>=0.27.2",
    "unidiff>=1.0.1",
]

[project.scripts]
mentor = "mentor.main:app"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E","W","I","F","B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config"
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

